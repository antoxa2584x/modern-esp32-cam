; ESP32-CAM home security camera firmware.
; Build: pio run          Flash: pio run -t upload          Logs: pio device monitor
; Boards: esp32s3cam (ESP32-S3-CAM N16R8 / HW-679, default) and esp32cam
; (AI-Thinker ESP32-CAM): pio run -e esp32cam -t upload

[platformio]
default_envs = esp32s3cam

[env]
platform = espressif32@6.11.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = pre:scripts/embed_web.py
lib_deps =
    esp32async/AsyncTCP@3.4.9
    esp32async/ESPAsyncWebServer@3.8.1
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DFW_VERSION=\"1.2.2\"
    ; Remote-access server and its registration code, baked into the firmware
    ; (optional, both can be typed in the UI). Set them before `pio run`, e.g.
    ;   $env:RELAY_HOST="cam.example.com"; $env:RELAY_TOKEN="..."
    -DRELAY_HOST=\"${sysenv.RELAY_HOST}\"
    -DRELAY_TOKEN=\"${sysenv.RELAY_TOKEN}\"

; AI-Thinker ESP32-CAM: OV2640, 4 MB flash, 4 MB PSRAM
[env:esp32cam]
board = esp32cam
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; ESP32-S3-CAM N16R8 (HW-679): 16 MB flash, 8 MB octal PSRAM. Flashed over
; UART0 with the ESP32-CAM-MB board, so Serial stays on UART0.
[env:esp32s3cam]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3_CAM
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    ${env.lib_deps}
    bitbank2/JPEGDEC@1.8.4  ; face recognition's JPEG decoder (see src/faces.cpp)
