# nginx site for the relay, e.g. /etc/nginx/sites-available/cam
# Replace cam.example.com with your subdomain.
#
# Cameras get their own subdomain: their pages run JavaScript, so they must
# not share an origin with another site that has its own logins and cookies.
# Certificate, for example:  certbot --nginx -d cam.example.com

server {
    listen 80;
    server_name cam.example.com;
    return 301 https://cam.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name cam.example.com;

    ssl_certificate /etc/letsencrypt/live/cam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.example.com/privkey.pem;

    # The relay sets CSP, framing and referrer headers itself
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cameras connect here (WebSocket)
    location = /cam-relay/ws {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Browsers open https://cam.example.com/cam/<id>/
    location /cam/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;            # live video must not be buffered
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4m;        # firmware updates
    }

    location / {
        return 404;
    }
}
